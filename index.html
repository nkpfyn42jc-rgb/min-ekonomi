<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2342"><link rel="manifest" href="manifest.webmanifest"><title>Min ekonomi</title>
<style>
:root{--bg:#07182d;--card:#0d2a4d;--card2:#12365e;--text:#fff;--muted:#a9bdd4;--accent:#5da9ff;--good:#55d98b;--bad:#ff7777;--line:#23476e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;padding-bottom:82px}.app{max-width:720px;margin:auto;padding:18px 16px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:28px;margin:0}.top small,.muted,.label{color:var(--muted)}.label{font-size:13px}.card,.item,.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:9px 0}.hero{background:linear-gradient(145deg,#123b68,#0b2342)}.big{font-size:34px;font-weight:750;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{margin:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.section{font-size:19px;margin:20px 0 7px}.good{color:var(--good)}.bad{color:var(--bad)}.btn{background:var(--accent);color:#06172a;border:0;border-radius:11px;padding:10px 14px;font-weight:700}.btn.secondary{background:var(--card2);color:#fff}.btn.danger{background:#7c2932;color:#fff}.btn.small{padding:7px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.list{display:grid;gap:7px}.bar{height:8px;background:#193b60;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.chart{height:145px;display:flex;align-items:end;gap:7px}.barcol{flex:1;text-align:center}.barcol i{display:block;background:var(--accent);border-radius:5px 5px 0 0}.barcol span{font-size:10px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#081d35ee;border-top:1px solid var(--line);backdrop-filter:blur(16px);display:flex;justify-content:center;z-index:5}.nav button{flex:1;max-width:140px;background:none;color:var(--muted);padding:9px 3px;font-size:11px}.nav button.active{color:#fff}.nav span{display:block;font-size:18px}.form{display:grid;gap:9px}.form input,.form select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#081f39;color:#fff}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:end;z-index:10}.sheet{background:#0b2342;width:100%;max-height:90vh;overflow:auto;border-radius:21px 21px 0 0;padding:19px}.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:14px}
</style></head><body><div id="app"></div><div class="nav" id="nav"></div><div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div>
<script>
const KEY="minEkonomiV2";
const seed={desiredSavingsPct:20,savingsPlans:5000,categories:["Mat","Boende","Nöjen","Transport","Abonnemang","Träning","Övrigt"],budgets:{Mat:3000,Boende:6000,Nöjen:1500,Transport:1200,Abonnemang:700,Träning:500,Övrigt:1000},transactions:[
{id:1,name:"ICA Maxi",amount:426,date:"2026-09-03",category:"Mat",note:"",type:"expense"},{id:2,name:"Spotify",amount:119,date:"2026-09-05",category:"Abonnemang",note:"",type:"expense"},{id:3,name:"Gym",amount:299,date:"2026-09-07",category:"Träning",note:"",type:"expense"},{id:4,name:"Swish – Johan",amount:250,date:"2026-09-09",category:"Övrigt",note:"",type:"expense"},{id:5,name:"Lön",amount:28700,date:"2026-09-01",category:"Lön",note:"",type:"income"}],
accounts:[{id:1,name:"Lönekonto",type:"Vanligt konto",balance:8500},{id:2,name:"Sparkonto",type:"Sparkonto",balance:18400},{id:3,name:"Avanza",type:"Investering",balance:48600}],goals:[{id:1,name:"Buffert",target:30000,current:18400,deadline:"",account:"Sparkonto"},{id:2,name:"Investeringar",target:100000,current:42000,deadline:"2028-12-31",account:"Avanza"}],bills:[{id:1,name:"Hyra",amount:5500,due:"2026-09-25",recurring:true,paid:false},{id:2,name:"Spotify",amount:119,due:"2026-09-20",recurring:true,paid:false}],rules:{"ICA MAXI":"Mat","ICA":"Mat","Spotify":"Abonnemang","Gym":"Träning"}};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||seed,page="Översikt";
const fmt=n=>new Intl.NumberFormat("sv-SE",{style:"currency",currency:"SEK",maximumFractionDigits:0}).format(n||0),mth=()=>new Date().toISOString().slice(0,7);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function ex(m=mth()){return state.transactions.filter(x=>x.type=="expense"&&x.date.startsWith(m))}function inc(m=mth()){return state.transactions.filter(x=>x.type=="income"&&x.date.startsWith(m))}function total(){return state.accounts.reduce((a,x)=>a+x.balance,0)}function spent(){return ex().reduce((a,x)=>a+x.amount,0)}function bills(){return state.bills.filter(x=>!x.paid).reduce((a,x)=>a+x.amount,0)}function left(){return Math.max(0,total()-bills()-(state.savingsPlans||0))}function days(){let d=new Date(),e=new Date(d.getFullYear(),d.getMonth()+1,0);return Math.max(1,e.getDate()-d.getDate()+1)}function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function nav(){let a=[["Översikt","⌂"],["Transaktioner","↕"],["Budget","▤"],["Sparande","◒"],["Konton","◉"]];navEl.innerHTML=a.map(x=>`<button class="${page==x[0]?"active":""}" onclick="page='${x[0]}';render()"><span>${x[1]}</span>${x[0]}</button>`).join("")}
const navEl=document.getElementById("nav"),app=document.getElementById("app"),modal=document.getElementById("modal"),sheet=document.getElementById("sheet");
function render(){nav();app.innerHTML=`<main class="app"><div class="top"><div><h1>Min ekonomi</h1><small>${new Date().toLocaleDateString("sv-SE",{month:"long",year:"numeric"})}</small></div><button class="btn secondary small" onclick="settings()">Inställningar</button></div>${({Översikt:overview,Transaktioner:transactions,Budget:budget,Sparande:savings,Konton:accounts})[page]()}</main>`}
function overview(){let ei=inc().reduce((a,x)=>a+x.amount,0),sp=spent();return `<div class="card hero"><div class="label">Pengar kvar denna månad</div><div class="big">${fmt(left())}</div><div class="muted">Efter obetalda räkningar och planerat sparande</div><div class="grid" style="margin-top:11px"><div class="stat"><div class="label">Kan spendera per dag</div><b>${fmt(left()/days())}</b></div><div class="stat"><div class="label">Planerat sparande</div><b>${fmt(state.savingsPlans)}</b></div></div></div><div class="grid"><div class="stat"><div class="label">Inkomster</div><b>${fmt(ei)}</b></div><div class="stat"><div class="label">Utgifter</div><b>${fmt(sp)}</b></div><div class="stat"><div class="label">Sparande</div><b class="good">${fmt(Math.max(0,ei-sp))}</b></div><div class="stat"><div class="label">Tillgångar</div><b>${fmt(total())}</b></div></div><h2 class="section">Utgifter senaste 6 månaderna</h2><div class="card"><div class="chart">${chart()}</div></div><h2 class="section">Kommande räkningar</h2><div class="list">${state.bills.filter(x=>!x.paid).sort((a,b)=>a.due.localeCompare(b.due)).map(bill).join("")||'<div class="empty">Inga obetalda räkningar</div>'}</div><h2 class="section">Senaste</h2><div class="list">${[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(tx).join("")}</div>`}
function chart(){let a=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let m=d.toISOString().slice(0,7),v=ex(m).reduce((s,x)=>s+x.amount,0);a.push({m,v})}let mx=Math.max(...a.map(x=>x.v),1);return a.map(x=>`<div class="barcol"><i style="height:${Math.max(5,x.v/mx*105)}px"></i><span>${x.m.slice(5)}</span></div>`).join("")}
function tx(t){return `<div class="item"><div class="row"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.category)} · ${t.date}</div></div><b class="${t.type=="income"?"good":"bad"}">${t.type=="income"?"+":"−"}${fmt(t.amount)}</b></div></div>`}
function bill(b){return `<div class="item"><div class="row"><div><b>${esc(b.name)}</b><div class="muted">${b.due} · ${fmt(b.amount)}</div></div><button class="btn small" onclick="pay(${b.id})">Betald</button></div></div>`}
function transactions(){return `<div class="actions"><button class="btn" onclick="txForm()">+ Transaktion</button><button class="btn secondary" onclick="splitForm()">Dela utgift</button></div><div class="card"><input style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#081f39;color:white" placeholder="Sök..." oninput="search(this.value)"></div><div class="list" id="txs">${txlist(state.transactions)}</div>`}
function txlist(a){return [...a].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item"><div class="row"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.category)} · ${t.date}${t.note?" · "+esc(t.note):""}</div></div><div style="text-align:right"><div class="${t.type=="income"?"good":"bad"}">${t.type=="income"?"+":"−"}${fmt(t.amount)}</div><div class="actions"><button class="btn secondary small" onclick="txForm(${t.id})">Ändra</button><button class="btn danger small" onclick="del(${t.id})">Ta bort</button></div></div></div></div>`).join("")||'<div class="empty">Inga transaktioner</div>'}
function search(q){document.getElementById("txs").innerHTML=txlist(state.transactions.filter(t=>(t.name+" "+t.category+" "+t.note).toLowerCase().includes(q.toLowerCase())))}
function budget(){return `<div class="actions"><button class="btn" onclick="budgetForm()">Redigera budget</button><button class="btn secondary" onclick="catForm()">+ Kategori</button></div><div class="card"><div class="row"><span>Total budget</span><b>${fmt(Object.values(state.budgets).reduce((a,x)=>a+x,0))}</b></div></div><div class="list">${state.categories.map(c=>{let v=ex().filter(x=>x.category==c).reduce((a,x)=>a+x.amount,0),b=state.budgets[c]||0;return `<div class="item"><div class="row"><b>${esc(c)}</b><span>${fmt(v)} / ${fmt(b)}</span></div><div class="bar"><i style="width:${pct(v,b)}%"></i></div></div>`}).join("")}</div><h2 class="section">Jämfört med förra månaden</h2><div class="card">${compare()}</div>`}
function compare(){let d=new Date();d.setMonth(d.getMonth()-1);let pm=d.toISOString().slice(0,7);return state.categories.map(c=>{let n=ex().filter(x=>x.category==c).reduce((a,x)=>a+x.amount,0),o=ex(pm).filter(x=>x.category==c).reduce((a,x)=>a+x.amount,0),q=n-o;if(!n&&!o)return "";return `<div class="row" style="margin:7px 0"><span>${esc(c)}</span><span class="${q<=0?"good":"bad"}">${q<=0?"−":"+"}${fmt(Math.abs(q))}</span></div>`}).join("")||'<div class="empty">Ingen jämförelsedata ännu.</div>'}
function savings(){return `<div class="card hero"><div class="label">Önskad sparandel</div><div class="big">${state.desiredSavingsPct}%</div><div class="muted">Planerat sparande: ${fmt(state.savingsPlans)}/månad</div></div><div class="actions"><button class="btn" onclick="goalForm()">+ Sparmål</button><button class="btn secondary" onclick="planForm()">Planerat sparande</button></div><h2 class="section">Sparmål</h2><div class="list">${state.goals.map(g=>`<div class="item"><div class="row"><b>${esc(g.name)}</b><b>${fmt(g.current)}</b></div><div class="muted">Mål ${fmt(g.target)} · ${pct(g.current,g.target)}%</div><div class="bar"><i style="width:${pct(g.current,g.target)}%"></i></div>${g.deadline?`<div class="muted" style="margin-top:7px">Behöver ca ${fmt(Math.max(0,g.target-g.current)/Math.max(1,(new Date(g.deadline).getFullYear()-new Date().getFullYear())*12+new Date(g.deadline).getMonth()-new Date().getMonth()))}/månad till ${g.deadline}</div>`:""}<div class="actions" style="margin-top:8px"><button class="btn secondary small" onclick="deposit(${g.id})">Sätt in</button><button class="btn secondary small" onclick="editGoal(${g.id})">Ändra</button></div></div>`).join("")}</div><h2 class="section">Investeringar</h2><div class="card">${fmt(state.accounts.filter(a=>a.type=="Investering").reduce((a,x)=>a+x.balance,0))} totalt · fonder/aktier kan registreras som separata investeringstillgångar via konton.</div>`}
function accounts(){return `<div class="card hero"><div class="label">Totala tillgångar</div><div class="big">${fmt(total())}</div><div class="muted">Överföringar mellan egna konton är inte utgifter.</div></div><button class="btn" onclick="accountForm()">+ Konto</button><div class="list" style="margin-top:10px">${state.accounts.map(a=>`<div class="item"><div class="row"><div><b>${esc(a.name)}</b><div class="muted">${esc(a.type)}</div></div><b>${fmt(a.balance)}</b></div><button class="btn secondary small" onclick="editAccount(${a.id})">Ändra</button></div>`).join("")}</div><h2 class="section">Räkningar</h2><button class="btn" onclick="billForm()">+ Räkning</button><div class="list">${state.bills.map(bill).join("")}</div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function open(x){sheet.innerHTML=x;modal.classList.remove("hidden")}function close(){modal.classList.add("hidden")}modal.onclick=e=>{if(e.target===modal)close()}
function f(l,id,v="",type="text"){return `<label class="label">${l}<input id="${id}" type="${type}" value="${esc(v)}"></label>`}
function txForm(id){let t=state.transactions.find(x=>x.id==id)||{name:"",amount:"",date:new Date().toISOString().slice(0,10),category:state.categories[0],note:"",type:"expense"};open(`<h2>${id?"Ändra":"Ny"} transaktion</h2><div class="form">${f("Namn","n",t.name)}${f("Belopp","a",t.amount,"number")}${f("Datum","d",t.date,"date")}<label class="label">Typ<select id="ty"><option value="expense" ${t.type=="expense"?"selected":""}>Utgift</option><option value="income" ${t.type=="income"?"selected":""}>Inkomst</option></select></label><label class="label">Kategori<select id="c">${state.categories.map(c=>`<option ${c==t.category?"selected":""}>${esc(c)}</option>`).join("")}</select></label>${f("Anteckning","no",t.note)}<button class="btn" onclick="saveTx(${id||0})">Spara</button></div>`)}
function saveTx(id){let t={id:id||Date.now(),name:n.value,amount:+a.value||0,date:d.value,category:c.value,note:no.value,type:ty.value},i=state.transactions.findIndex(x=>x.id==id);i>=0?state.transactions[i]=t:state.transactions.push(t);save();close();render()}function del(id){if(confirm("Ta bort?")){state.transactions=state.transactions.filter(x=>x.id!=id);save();render()}}
function budgetForm(){open(`<h2>Budget</h2><div class="form">${state.categories.map(c=>f(c,c.replace(/\W/g,"_"),state.budgets[c]||0,"number")).join("")}<button class="btn" onclick="state.categories.forEach(c=>state.budgets[c]=+document.getElementById(c.replace(/\\W/g,'_')).value||0);save();close();render()">Spara</button></div>`)}
function catForm(){open(`<h2>Ny kategori</h2><div class="form">${f("Namn","cn")}<button class="btn" onclick="let x=cn.value.trim();if(x&&!state.categories.includes(x)){state.categories.push(x);state.budgets[x]=0;save()}close();render()">Lägg till</button></div>`)}
function goalForm(){open(`<h2>Nytt sparmål</h2><div class="form">${f("Namn","gn")}${f("Målbelopp","gt","0","number")}${f("Nuvarande","gc","0","number")}${f("Deadline","gd","","date")}${f("Konto","ga","")}<button class="btn" onclick="state.goals.push({id:Date.now(),name:gn.value,target:+gt.value,current:+gc.value,deadline:gd.value,account:ga.value});save();close();render()">Spara</button></div>`)}
function editGoal(id){let g=state.goals.find(x=>x.id==id);open(`<h2>Ändra sparmål</h2><div class="form">${f("Namn","gn",g.name)}${f("Målbelopp","gt",g.target,"number")}${f("Nuvarande","gc",g.current,"number")}${f("Deadline","gd",g.deadline,"date")}${f("Konto","ga",g.account)}<button class="btn" onclick="Object.assign(g,{name:gn.value,target:+gt.value,current:+gc.value,deadline:gd.value,account:ga.value});save();close();render()">Spara</button></div>`)}
function deposit(id){let g=state.goals.find(x=>x.id==id);open(`<h2>Sätt in</h2><div class="form">${f("Belopp","de","0","number")}<button class="btn" onclick="g.current+=+de.value||0;save();close();render()">Spara</button></div>`)}
function planForm(){open(`<h2>Planerat sparande</h2><div class="form">${f("Kr per månad","pl",state.savingsPlans,"number")}<button class="btn" onclick="state.savingsPlans=+pl.value||0;save();close();render()">Spara</button></div>`)}
function accountForm(){open(`<h2>Nytt konto</h2><div class="form">${f("Namn","an")}${f("Saldo","ab","0","number")}<label class="label">Typ<select id="at"><option>Vanligt konto</option><option>Sparkonto</option><option>Investering</option></select></label><button class="btn" onclick="state.accounts.push({id:Date.now(),name:an.value,balance:+ab.value||0,type:at.value});save();close();render()">Spara</button></div>`)}
function editAccount(id){let a=state.accounts.find(x=>x.id==id);open(`<h2>Ändra konto</h2><div class="form">${f("Namn","an",a.name)}${f("Saldo","ab",a.balance,"number")}<label class="label">Typ<select id="at"><option ${a.type=="Vanligt konto"?"selected":""}>Vanligt konto</option><option ${a.type=="Sparkonto"?"selected":""}>Sparkonto</option><option ${a.type=="Investering"?"selected":""}>Investering</option></select></label><button class="btn" onclick="Object.assign(a,{name:an.value,balance:+ab.value||0,type:at.value});save();close();render()">Spara</button></div>`)}
function billForm(){open(`<h2>Ny räkning</h2><div class="form">${f("Namn","bn")}${f("Belopp","ba","0","number")}${f("Förfallodatum","bd","","date")}<label><input id="br" type="checkbox"> Återkommande</label><button class="btn" onclick="state.bills.push({id:Date.now(),name:bn.value,amount:+ba.value||0,due:bd.value,recurring:br.checked,paid:false});save();close();render()">Spara</button></div>`)}
function pay(id){let b=state.bills.find(x=>x.id==id);b.paid=true;save();render()}
function splitForm(){open(`<h2>Dela utgift</h2><div class="form">${f("Namn","sn")}${f("Datum","sd",new Date().toISOString().slice(0,10),"date")}${f("Del 1","s1","0","number")}${f("Del 2","s2","0","number")}${f("Del 3","s3","0","number")}<div class="muted">Delarna blir separata transaktioner och kan kategoriseras efteråt.</div><button class="btn" onclick="let v=[+s1.value||0,+s2.value||0,+s3.value||0].filter(Boolean);v.forEach((x,i)=>state.transactions.push({id:Date.now()+i,name:sn.value+' – del '+(i+1),amount:x,date:sd.value,category:state.categories[0],note:'Delad utgift',type:'expense'}));save();close();render()">Spara</button></div>`)}
function settings(){open(`<h2>Inställningar</h2><div class="form">${f("Önskad sparandel %","sp",state.desiredSavingsPct,"number")}<button class="btn" onclick="state.desiredSavingsPct=Math.max(0,Math.min(100,+sp.value||0));save();close();render()">Spara</button><button class="btn danger" onclick="if(confirm('Återställa exempeldata?')){localStorage.removeItem(KEY);location.reload()}">Återställ exempeldata</button></div>`)}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
