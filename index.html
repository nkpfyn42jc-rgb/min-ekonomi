<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Min ekonomi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Min ekonomi</title>
<style>
:root{--bg:#061226;--panel:#0a1b35;--card:#0e2546;--line:#1c3a62;--text:#fff;--muted:#9fb2cf;--accent:#78aefc;--good:#62c6a3;--bad:#df7f91;--warn:#e6b85f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sub{color:var(--muted);font-size:13px}h1{font-size:27px;margin:3px 0}.total{text-align:right}.total b{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.label{color:var(--muted);font-size:13px}.big{font-size:30px;font-weight:700;margin-top:6px}.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.section{margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.small{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#172e50;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--accent);border-radius:10px}
nav{position:sticky;bottom:0;background:rgba(6,18,38,.96);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px 0 calc(7px + env(safe-area-inset-bottom));margin-top:16px;border-top:1px solid var(--line)}
nav button{border:0;background:transparent;color:var(--muted);min-height:48px;border-radius:12px;font-size:11px}nav button.active{background:#17365f;color:#fff}
.btn{border:1px solid var(--line);background:#17365f;color:#fff;border-radius:12px;min-height:44px;padding:0 14px}.btn.secondary{background:transparent}.form{display:grid;gap:10px}.input{width:100%;min-height:46px;border:1px solid var(--line);background:#081a33;color:#fff;border-radius:11px;padding:0 12px}.form label{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.chart{height:150px;display:flex;align-items:end;gap:8px;padding-top:15px}.bar{flex:1;background:var(--accent);border-radius:7px 7px 2px 2px;min-height:5px}.chartlabels{display:flex;gap:8px}.chartlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.notice{padding:12px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:13px}.empty{text-align:center;padding:30px 10px;color:var(--muted)}
@media(max-width:430px){.grid{grid-template-columns:1fr}.big{font-size:27px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY="min-ekonomi-v1";
const seed={
 income:28700, monthlySavings:5000, spendable:4280,
 transactions:[
  {name:"ICA Maxi",category:"Mat",amount:426,date:"2026-09-02",type:"expense"},
  {name:"Spotify",category:"Abonnemang",amount:119,date:"2026-09-03",type:"expense"},
  {name:"Gym",category:"Träning",amount:299,date:"2026-09-04",type:"expense"},
  {name:"Swish – Johan",category:"Övrigt",amount:250,date:"2026-09-05",type:"expense",swish:true},
  {name:"Hyra",category:"Boende",amount:5500,date:"2026-09-06",type:"expense"}
 ],
 budgets:[
  {name:"Mat",limit:3000,spent:1426},{name:"Boende",limit:6000,spent:5500},
  {name:"Nöjen",limit:1500,spent:620},{name:"Transport",limit:1200,spent:480},
  {name:"Abonnemang",limit:700,spent:419}
 ],
 goals:[
  {name:"Buffert",target:30000,current:18400,deadline:"2027-09-01",account:"Sparkonto"},
  {name:"Investeringar",target:100000,current:42000,deadline:"2028-01-01",account:"Avanza"}
 ],
 accounts:[
  {name:"Lönekonto",balance:8500,type:"Kontant"},
  {name:"Sparkonto",balance:18400,type:"Sparkonto"},
  {name:"Avanza",balance:48600,type:"Investeringar"}
 ],
 settings:{dark:true}
};
let state=load(); let tab="overview";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function kr(n){return new Intl.NumberFormat("sv-SE",{maximumFractionDigits:0}).format(Math.round(n))+" kr"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function total(){return state.accounts.reduce((a,x)=>a+Number(x.balance||0),0)}
function daysLeft(){let d=new Date(), end=new Date(d.getFullYear(),d.getMonth()+1,0);return Math.max(1,end.getDate()-d.getDate()+1)}
function render(){
 const app=document.getElementById("app");
 app.innerHTML=`<header><div><div class="sub">${new Intl.DateTimeFormat("sv-SE",{dateStyle:"long"}).format(new Date())}</div><h1>Min ekonomi</h1></div><div class="total"><div class="sub">Totalt</div><b>${kr(total())}</b></div></header><main id="main"></main>
 <nav>${[
  ["overview","Översikt"],["transactions","Transaktioner"],["budget","Budget"],["saving","Sparande"],["accounts","Konton"]
 ].map(x=>`<button class="${tab===x[0]?"active":""}" data-tab="${x[0]}">${x[1]}</button>`).join("")}</nav>`;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 renderMain();
}
function renderMain(){
 const m=document.getElementById("main");
 if(tab==="overview") m.innerHTML=overview();
 if(tab==="transactions") m.innerHTML=transactions();
 if(tab==="budget") m.innerHTML=budget();
 if(tab==="saving") m.innerHTML=saving();
 if(tab==="accounts") m.innerHTML=accounts();
 bind();
}
function overview(){
 const per=Math.max(0,state.spendable/daysLeft());
 const vals=[5100,6200,4700,7100,5600,8420], max=Math.max(...vals);
 return `<div class="grid">
 <div class="card"><div class="label">Pengar kvar denna månad</div><div class="big">${kr(state.spendable)}</div><div class="small">≈ ${kr(per)} per dag</div></div>
 <div class="card"><div class="label">Planerat sparande</div><div class="big good">${kr(state.monthlySavings)}</div><div class="small">Mål: 20 % av inkomsten</div></div></div>
 <div class="card section"><div style="display:flex;justify-content:space-between"><div><b>Inkomster och utgifter</b><div class="small">Senaste 6 månaderna</div></div><b class="good">+8 420 kr</b></div>
 <div class="chart">${vals.map(v=>`<i class="bar" style="height:${Math.round(v/max*100)}%"></i>`).join("")}</div><div class="chartlabels">${["apr","maj","jun","jul","aug","sep"].map(x=>`<span>${x}</span>`).join("")}</div></div>
 <div class="card section"><b>Senaste utgifter</b>${state.transactions.slice(0,4).map(t=>`<div class="row"><div>${esc(t.name)}<div class="small">${esc(t.category)}</div></div><span class="bad">−${kr(t.amount)}</span></div>`).join("")}</div>
 <div class="card section"><b>Din ekonomi</b><div class="row"><span class="muted">Inkomst</span><b>${kr(state.income)}</b></div><div class="row"><span class="muted">Sparande</span><b class="good">${kr(state.monthlySavings)}</b></div><div class="row"><span class="muted">Tillgångar</span><b>${kr(total())}</b></div></div>`;
}
function transactions(){
 return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>Transaktioner</b><div class="small">Bankimport eller manuell registrering</div></div><button class="btn" id="addTx">+ Lägg till</button></div>
 <div id="txList">${state.transactions.length?state.transactions.map((t,i)=>`<div class="row"><div>${esc(t.name)}<div class="small">${esc(t.category)} · ${t.date}</div></div><div><span class="bad">−${kr(t.amount)}</span><button class="btn secondary" data-del="${i}" style="margin-left:6px;min-height:36px;padding:0 9px">×</button></div></div>`).join(""):`<div class="empty">Inga transaktioner ännu.</div>`}</div></div><div id="txForm"></div>`;
}
function budget(){
 return `<div class="card"><b>Budget – september</b><div class="small">Du sätter gränserna själv.</div>${state.budgets.map((b,i)=>{let p=Math.min(100,b.spent/b.limit*100);return `<div class="section"><div style="display:flex;justify-content:space-between"><span>${esc(b.name)}</span><span>${kr(b.spent)} / ${kr(b.limit)}</span></div><div class="progress"><i style="width:${p}%"></i></div></div>`}).join("")}</div><div class="card section"><b>Total budget</b><div class="row"><span class="muted">Budget</span><b>${kr(state.budgets.reduce((a,b)=>a+b.limit,0))}</b></div><div class="row"><span class="muted">Förbrukat</span><b>${kr(state.budgets.reduce((a,b)=>a+b.spent,0))}</b></div></div>`;
}
function saving(){
 return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>Sparmål</b><div class="small">Sparande och investeringar hålls isär.</div></div><button class="btn" id="addGoal">+ Mål</button></div>${state.goals.map((g,i)=>{let p=Math.min(100,g.current/g.target*100);let months=Math.max(1,Math.round((new Date(g.deadline)-new Date())/(30.44*864e5)));let need=Math.max(0,(g.target-g.current)/months);return `<div class="section"><div style="display:flex;justify-content:space-between"><span>${esc(g.name)}</span><span>${kr(g.current)} / ${kr(g.target)}</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="small" style="margin-top:7px">${p.toFixed(0)} % · ca ${kr(need)}/månad till ${g.deadline}</div></div>`}).join("")}</div><div class="card section"><b>Investeringar</b><div class="row"><span>Fonder</span><b>24 300 kr</b></div><div class="row"><span>Aktier</span><b>24 300 kr</b></div><div class="row"><span>Totalt Avanza</span><b>48 600 kr</b></div></div>`;
}
function accounts(){
 return `<div class="card"><b>Konton och tillgångar</b>${state.accounts.map((a,i)=>`<div class="row"><div>${esc(a.name)}<div class="small">${esc(a.type)}</div></div><b>${kr(a.balance)}</b></div>`).join("")}<div class="row"><b>Totalt</b><b>${kr(total())}</b></div></div><div class="card section"><b>Bankkoppling</b><p class="small">Automatisk bankimport är förberedd som integrationslager. Varbergs Sparbank erbjuder PSD2/Open Banking för licensierade tredjepartsaktörer. En kostnadsfri koppling kan därför inte lovas utan att välja en konkret leverantör och kontrollera deras villkor.</p><button class="btn secondary" id="bankInfo">Om bankkopplingen</button></div><div class="card section"><b>Data</b><p class="small">All prototypdata sparas lokalt i webbläsaren på enheten. Den skickas inte någonstans av den här versionen.</p><button class="btn secondary" id="reset">Återställ exempeldata</button></div>`;
}
function bind(){
 const add=document.getElementById("addTx"); if(add) add.onclick=()=>{document.getElementById("txForm").innerHTML=`<div class="card section"><form class="form" id="txNew"><label>Namn<input class="input" name="name" required placeholder="T.ex. ICA"></label><label>Belopp<input class="input" name="amount" required type="number" min="0" step="0.01" placeholder="0"></label><label>Kategori<select class="input" name="category">${["Mat","Boende","Nöjen","Transport","Abonnemang","Träning","Övrigt"].map(x=>`<option>${x}</option>`).join("")}</select></label><label>Datum<input class="input" name="date" required type="date" value="${new Date().toISOString().slice(0,10)}"></label><div class="actions"><button class="btn" type="submit">Spara</button><button class="btn secondary" type="button" id="cancel">Avbryt</button></div></form></div>`;document.getElementById("cancel").onclick=renderMain;document.getElementById("txNew").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.transactions.unshift({name:f.get("name"),amount:Number(f.get("amount"))||0,category:f.get("category"),date:f.get("date"),type:"expense"});save();renderMain()};};
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.transactions.splice(Number(b.dataset.del),1);save();renderMain()});
 const goal=document.getElementById("addGoal"); if(goal) goal.onclick=()=>{const name=prompt("Namn på sparmål");if(!name)return;const target=Number(prompt("Målvärde i kr"));if(!target)return;state.goals.push({name,target,current:0,deadline:"2027-09-01",account:"Sparkonto"});save();renderMain()};
 const reset=document.getElementById("reset");if(reset)reset.onclick=()=>{if(confirm("Återställa all lokal prototypdata?")){state=structuredClone(seed);save();render()}};
 const bi=document.getElementById("bankInfo");if(bi)bi.onclick=()=>alert("Nästa integrationssteg är en licensierad Open Banking-leverantör. Banken stödjer PSD2/Open Banking, men själva appen behöver en säker serverdel för autentisering och tokenhantering.");
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
